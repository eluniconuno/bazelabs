  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
    }
    
    /* WhatsApp Floating Button */
    .whatsapp-float {
        position: fixed;
        bottom: 32px;
        right: 32px;
        width: 60px;
        height: 60px;
        background: rgba(10, 10, 10, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(245, 245, 247, 0.15);
        color: #F5F5F7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        text-decoration: none;
    }

    .whatsapp-float:hover {
        background: #F5F5F7;
        color: #0A0A0A;
        border-color: #F5F5F7;
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 12px 32px rgba(245, 245, 247, 0.15);
    }

    .whatsapp-float svg {
        width: 28px;
        height: 28px;
        transition: transform 0.3s ease;
    }

    @media (max-width: 768px) {
        .whatsapp-float {
            bottom: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
        }
        .whatsapp-float svg {
            width: 24px;
            height: 24px;
        }
    }
  </style>
